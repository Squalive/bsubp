[package]
name = "bsubp"
version = "1.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
walkdir = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.18"
inquire = "0.9"
chrono = "0.4"
zstd = "0.13"
tar = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
